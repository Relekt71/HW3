input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Парсим JSON если пришёл как строка
  json {
    source => "message"
    target => "parsed"
    skip_on_invalid_json => true
  }
  
  # Извлекаем поля из распарсенного JSON
  if [parsed][value] {
    mutate {
      add_field => { "value" => "%{[parsed][value]}" }
      add_field => { "message" => "%{[parsed][message]}" }
    }
  }
  
  date {
    match => ["timestamp", "UNIX"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://es-hot:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}